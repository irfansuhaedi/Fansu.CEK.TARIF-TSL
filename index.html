<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Tarif TSL</title>
    <link rel="icon" type="image/png" href="https://i.imgur.com/ZBlHjQj.png">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --orange: #FF6B00;
            --orange2: #FF9A3C;
            --yellow: #FFD600;
            --dark: #0D0D0D;
            --dark2: #151515;
            --dark3: #1E1E1E;
            --white: #F5F0E8;
            --grey: #888;
        }

        html, body {
            min-height: 100%;
            font-family: 'Outfit', sans-serif;
            background: var(--dark);
            color: var(--white);
            overflow-x: hidden;
            cursor: none;
        }

        /* Custom cursor */
        .cursor {
            width: 12px; height: 12px;
            background: var(--orange);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: transform 0.1s, width 0.2s, height 0.2s, background 0.2s;
            mix-blend-mode: difference;
        }
        .cursor-ring {
            width: 36px; height: 36px;
            border: 1.5px solid var(--orange);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9998;
            transform: translate(-50%, -50%);
            transition: left 0.12s ease, top 0.12s ease, width 0.25s, height 0.25s;
            opacity: 0.6;
        }

        /* ── BACKGROUND ── */
        .bg {
            position: fixed; inset: 0; z-index: 0;
            overflow: hidden;
            background: var(--dark);
        }
        .bg-video {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            opacity: 0.04;
            mix-blend-mode: screen;
        }

        /* Diagonal stripe texture */
        .bg-stripes {
            position: absolute; inset: 0;
            background-image: repeating-linear-gradient(
                -55deg,
                transparent,
                transparent 60px,
                rgba(255,107,0,0.025) 60px,
                rgba(255,107,0,0.025) 61px
            );
        }

        /* Big decorative letter */
        .bg-letter {
            position: absolute;
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(300px, 45vw, 600px);
            color: rgba(255,107,0,0.04);
            line-height: 1;
            right: -60px;
            bottom: -80px;
            user-select: none;
            letter-spacing: -0.05em;
        }

        /* Animated scan line */
        .scanline {
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--orange), transparent);
            opacity: 0.3;
            animation: scan 6s linear infinite;
        }
        @keyframes scan {
            0%   { top: -2px; }
            100% { top: 100%; }
        }

        /* Corner accents */
        .corner {
            position: absolute;
            width: 80px; height: 80px;
            pointer-events: none;
        }
        .corner::before, .corner::after {
            content: '';
            position: absolute;
            background: var(--orange);
        }
        .corner::before { width: 2px; height: 100%; }
        .corner::after  { width: 100%; height: 2px; }
        .corner-tl { top: 24px; left: 24px; }
        .corner-tr { top: 24px; right: 24px; transform: scaleX(-1); }
        .corner-bl { bottom: 24px; left: 24px; transform: scaleY(-1); }
        .corner-br { bottom: 24px; right: 24px; transform: scale(-1); }

        /* ── LAYOUT ── */
        .page {
            position: relative; z-index: 1;
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            gap: 0;
            padding: 60px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ── LEFT PANEL ── */
        .left {
            padding-right: 60px;
            border-right: 1px solid rgba(255,107,0,0.2);
            animation: fadeLeft 0.8s cubic-bezier(0.16,1,0.3,1) both;
        }
        @keyframes fadeLeft {
            from { opacity: 0; transform: translateX(-40px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        .tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--orange);
            margin-bottom: 24px;
        }
        .tag-line {
            width: 32px; height: 1px;
            background: var(--orange);
        }
        .tag-dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--orange);
            box-shadow: 0 0 10px var(--orange);
            animation: blink 1.5s infinite;
        }
        @keyframes blink {
            0%,100% { opacity: 1; }
            50%      { opacity: 0.2; }
        }

        .headline {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(56px, 7vw, 96px);
            line-height: 0.92;
            letter-spacing: 0.01em;
            margin-bottom: 20px;
        }
        .headline em {
            font-style: normal;
            color: transparent;
            -webkit-text-stroke: 1.5px var(--orange);
        }

        .sub {
            font-size: 14px;
            font-weight: 300;
            color: var(--grey);
            line-height: 1.7;
            max-width: 360px;
            margin-bottom: 36px;
        }

        /* Stats row */
        .stats {
            display: flex;
            gap: 32px;
        }
        .stat {
            display: flex;
            flex-direction: column;
        }
        .stat-num {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 36px;
            color: var(--orange2);
            line-height: 1;
        }
        .stat-label {
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--grey);
            margin-top: 4px;
        }

        /* Logo area */
        .logo-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 48px;
            cursor: pointer;
            width: fit-content;
        }
        .logo-img {
            width: 44px; height: 44px;
            border-radius: 10px;
            border: 1px solid rgba(255,107,0,0.3);
            padding: 5px;
            background: rgba(255,107,0,0.08);
            transition: box-shadow 0.3s;
        }
        .logo-wrap:hover .logo-img {
            box-shadow: 0 0 20px rgba(255,107,0,0.4);
        }
        .logo-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 22px;
            letter-spacing: 0.1em;
            color: var(--white);
        }
        .logo-tagline {
            font-size: 9px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--grey);
        }

        /* ── RIGHT PANEL ── */
        .right {
            padding-left: 60px;
            animation: fadeRight 0.8s 0.15s cubic-bezier(0.16,1,0.3,1) both;
        }
        @keyframes fadeRight {
            from { opacity: 0; transform: translateX(40px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        .form-title {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--grey);
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .form-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, rgba(255,107,0,0.3), transparent);
        }

        /* Fields */
        .field { margin-bottom: 20px; }
        .field-label {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
        }
        .field-label span {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--grey);
        }
        .field-max {
            font-size: 10px;
            color: rgba(255,107,0,0.5);
            font-weight: 400;
            letter-spacing: 0.05em;
        }

        .input-shell {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-shell input {
            width: 100%;
            padding: 16px 60px 16px 20px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 28px;
            letter-spacing: 0.04em;
            color: var(--white);
            background: var(--dark2);
            border: 1px solid rgba(255,255,255,0.07);
            border-bottom: 2px solid rgba(255,107,0,0.3);
            border-radius: 4px 4px 0 0;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
            caret-color: var(--orange);
        }
        .input-shell input::placeholder {
            color: rgba(255,255,255,0.1);
            font-size: 28px;
        }
        .input-shell input:focus {
            background: rgba(255,107,0,0.05);
            border-bottom-color: var(--orange);
        }
        .input-shell input.err {
            border-bottom-color: #FF3B3B;
        }
        .unit-tag {
            position: absolute;
            right: 16px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.15em;
            color: var(--orange);
            text-transform: uppercase;
            pointer-events: none;
        }
        .field-error {
            font-size: 11px;
            color: #FF3B3B;
            margin-top: 6px;
            min-height: 14px;
            letter-spacing: 0.04em;
        }

        /* ── BUTTON ── */
        .btn-wrap { margin-top: 28px; position: relative; }
        .btn {
            width: 100%;
            padding: 18px 28px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 22px;
            letter-spacing: 0.15em;
            color: var(--dark);
            background: var(--orange);
            border: none;
            border-radius: 4px;
            cursor: none;
            position: relative;
            overflow: hidden;
            transition: transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 0 40px rgba(255,107,0,0.3), inset 0 1px 0 rgba(255,255,255,0.2);
        }
        .btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
            transition: left 0.5s;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 12px 50px rgba(255,107,0,0.5); }
        .btn:hover::before { left: 100%; }
        .btn:active { transform: translateY(0); }

        /* ── LOADING ── */
        .loading {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--orange);
        }
        .loading.on { display: flex; }
        .bar-loader {
            display: flex;
            gap: 4px;
        }
        .bar-loader span {
            display: block;
            width: 3px;
            height: 18px;
            background: var(--orange);
            border-radius: 2px;
            animation: barPulse 0.8s ease-in-out infinite;
        }
        .bar-loader span:nth-child(2) { animation-delay: 0.15s; height: 24px; }
        .bar-loader span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes barPulse {
            0%,100% { transform: scaleY(0.4); opacity: 0.4; }
            50%      { transform: scaleY(1); opacity: 1; }
        }

        /* ── RESULT ── */
        .result {
            margin-top: 24px;
            display: none;
            animation: resultIn 0.5s cubic-bezier(0.16,1,0.3,1) both;
        }
        .result.show { display: block; }
        @keyframes resultIn {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .result-box {
            border: 1px solid rgba(255,107,0,0.25);
            border-left: 3px solid var(--orange);
            background: var(--dark2);
            border-radius: 4px;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }
        .result-box::before {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 120px; height: 120px;
            background: radial-gradient(circle, rgba(255,107,0,0.12), transparent 70%);
            pointer-events: none;
        }

        .result-meta {
            display: flex;
            gap: 20px;
            margin-bottom: 16px;
        }
        .meta-chip {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 3px;
            padding: 6px 12px;
        }
        .meta-chip-label {
            font-size: 9px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--grey);
        }
        .meta-chip-val {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 20px;
            color: var(--white);
            letter-spacing: 0.04em;
            line-height: 1.2;
        }

        .divider-r {
            height: 1px;
            background: linear-gradient(90deg, rgba(255,107,0,0.3), transparent);
            margin: 16px 0;
        }

        .price-label-r {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--grey);
            margin-bottom: 4px;
        }
        .price-val {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 48px;
            color: var(--orange);
            letter-spacing: -0.01em;
            line-height: 1;
            text-shadow: 0 0 40px rgba(255,107,0,0.4);
        }
        .price-val.nego {
            font-size: 36px;
            color: var(--yellow);
            text-shadow: 0 0 40px rgba(255,214,0,0.3);
        }

        /* WA button */
        .wa-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 16px;
            padding: 14px 20px;
            background: linear-gradient(135deg, #128C7E, #25D366);
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(37,211,102,0.2);
        }
        .wa-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(37,211,102,0.4); }
        .wa-btn img { width: 20px; height: 20px; }

        /* ── RESPONSIVE ── */
        @media (max-width: 860px) {
            .page {
                grid-template-columns: 1fr;
                padding: 40px 24px;
            }
            .left {
                padding-right: 0;
                border-right: none;
                border-bottom: 1px solid rgba(255,107,0,0.2);
                padding-bottom: 40px;
                margin-bottom: 40px;
                text-align: center;
            }
            .right { padding-left: 0; }
            .stats { justify-content: center; }
            .tag { justify-content: center; }
            .logo-wrap { margin: 0 auto 36px; }
            .sub { margin: 0 auto 28px; }
            .corner { display: none; }
            .bg-letter { font-size: 200px; right: -30px; bottom: -30px; }
        }
    </style>
</head>
<body>

    <div class="cursor" id="cursor"></div>
    <div class="cursor-ring" id="ring"></div>

    <div class="bg">
        <video autoplay loop muted playsinline class="bg-video">
            <source src="https://i.imgur.com/Mce6742.mp4" type="video/mp4">
        </video>
        <div class="bg-stripes"></div>
        <div class="bg-letter">TSL</div>
        <div class="scanline"></div>
    </div>

    <!-- Corner accents -->
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <div class="page">
        <!-- LEFT -->
        <div class="left">
            <div class="logo-wrap" onclick="location.reload()">
                <img src="https://i.imgur.com/ZBlHjQj.png" class="logo-img" alt="Logo TSL">
                <div>
                    <div class="logo-name">TSL</div>
                    <div class="logo-tagline">Logistics & Transport</div>
                </div>
            </div>

            <div class="tag">
                <span class="tag-dot"></span>
                <span class="tag-line"></span>
                Sistem Tarif Online
            </div>

            <div class="headline">
                HITUNG<br>
                <em>TARIF</em><br>
                SEKARANG
            </div>

            <p class="sub">
                Kalkulasi biaya pengiriman secara instan berdasarkan tonase dan jarak tempuh. Akurat, cepat, transparan.
            </p>

            <div class="stats">
                <div class="stat">
                    <div class="stat-num">20T</div>
                    <div class="stat-label">Max Tonase</div>
                </div>
                <div class="stat">
                    <div class="stat-num">250</div>
                    <div class="stat-label">Max KM</div>
                </div>
                <div class="stat">
                    <div class="stat-num">24/7</div>
                    <div class="stat-label">Layanan</div>
                </div>
            </div>
        </div>

        <!-- RIGHT -->
        <div class="right">
            <div class="form-title">Kalkulator Biaya</div>

            <div class="field">
                <div class="field-label">
                    <span>Tonase</span>
                    <span class="field-max">Maks 20.000 Kg</span>
                </div>
                <div class="input-shell">
                    <input type="text" inputmode="numeric" id="tonase" placeholder="0" oninput="validateTonase(this)">
                    <span class="unit-tag">Kg</span>
                </div>
                <div class="field-error" id="errorTonase"></div>
            </div>

            <div class="field">
                <div class="field-label">
                    <span>Jarak</span>
                    <span class="field-max">Maks 250 Km</span>
                </div>
                <div class="input-shell">
                    <input type="number" inputmode="numeric" id="jarak" placeholder="0" oninput="validateJarak(this)">
                    <span class="unit-tag">Km</span>
                </div>
                <div class="field-error" id="errorJarak"></div>
            </div>

            <div class="btn-wrap">
                <button class="btn" onclick="hitungHarga()">Hitung Tarif →</button>
            </div>

            <div class="loading" id="loading">
                <div class="bar-loader">
                    <span></span><span></span><span></span>
                </div>
                Menghitung
            </div>

            <div class="result" id="hasil"></div>
        </div>
    </div>

    <script>
        // Custom cursor
        const cur = document.getElementById('cursor');
        const ring = document.getElementById('ring');
        document.addEventListener('mousemove', e => {
            cur.style.left = e.clientX + 'px';
            cur.style.top  = e.clientY + 'px';
            ring.style.left = e.clientX + 'px';
            ring.style.top  = e.clientY + 'px';
        });
        document.querySelectorAll('button, a, .logo-wrap').forEach(el => {
            el.addEventListener('mouseenter', () => {
                cur.style.width = '20px'; cur.style.height = '20px';
                ring.style.width = '54px'; ring.style.height = '54px';
            });
            el.addEventListener('mouseleave', () => {
                cur.style.width = '12px'; cur.style.height = '12px';
                ring.style.width = '36px'; ring.style.height = '36px';
            });
        });

        function formatAngka(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        }

        function validateTonase(input) {
            let angka = input.value.replace(/\D/g, "");
            if (parseInt(angka) > 20000) {
                document.getElementById("errorTonase").innerText = "Maksimal tonase hanya 20.000 Kg";
                input.value = "20.000";
            } else {
                document.getElementById("errorTonase").innerText = "";
                input.value = formatAngka(angka);
            }
            input.classList.remove('err');
        }

        function validateJarak(input) {
            if (parseInt(input.value) > 250) {
                document.getElementById("errorJarak").innerText = "Maksimal jarak hanya 250 Km";
                input.value = "250";
            } else {
                document.getElementById("errorJarak").innerText = "";
            }
            input.classList.remove('err');
        }

        function hitungHarga() {
            let tonaseInput = document.getElementById("tonase");
            let jarakInput  = document.getElementById("jarak");
            let tonase      = parseFloat(tonaseInput.value.replace(/\./g, "")) || 0;
            let jarak       = parseFloat(jarakInput.value) || 0;
            let hasilDiv    = document.getElementById("hasil");
            let loadingDiv  = document.getElementById("loading");
            let isValid     = true;

            document.getElementById("errorTonase").innerText = "";
            document.getElementById("errorJarak").innerText  = "";
            tonaseInput.classList.remove('err');
            jarakInput.classList.remove('err');

            if (!tonaseInput.value.trim()) {
                document.getElementById("errorTonase").innerText = "Harap isi tonase!";
                tonaseInput.classList.add('err');
                isValid = false;
            }
            if (!jarakInput.value.trim()) {
                document.getElementById("errorJarak").innerText = "Harap isi jarak!";
                jarakInput.classList.add('err');
                isValid = false;
            }
            if (!isValid) return;

            hasilDiv.classList.remove('show');
            loadingDiv.classList.add('on');

            setTimeout(() => {
                loadingDiv.classList.remove('on');

                // ── RUMUS TARIF (tidak diubah) ──
                let harga;
                if (jarak <= 100) {
                    if (tonase <= 500)        harga = (jarak <= 50) ? 150000 : 300000;
                    else if (tonase <= 3000)  harga = tonase * ((jarak <= 50) ? 250 : 300);
                    else if (tonase <= 5000)  harga = tonase * ((jarak <= 50) ? 150 : 275);
                    else if (tonase <= 20000) harga = tonase * ((jarak <= 50) ? 125 : 250);
                } else {
                    harga = "Negotiable";
                }
                // ────────────────────────────────

                let waMsg  = encodeURIComponent(`Halo Irfan, Saya ingin menanyakan tarif pengiriman dengan tonase ${formatAngka(tonase)} Kg dengan jarak ${jarak} Km.`);
                let waHref = `https://wa.me/628131342202?text=${waMsg}`;

                let priceSection = harga === "Negotiable"
                    ? `<div class="price-label-r">Estimasi Biaya</div>
                       <div class="price-val nego">🤝 NEGOTIABLE</div>
                       <a href="${waHref}" target="_blank" class="wa-btn">
                           <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WA">
                           Hubungi Admin Sekarang
                       </a>`
                    : `<div class="price-label-r">Estimasi Biaya</div>
                       <div class="price-val">Rp ${formatAngka(harga)}</div>`;

                hasilDiv.innerHTML = `
                    <div class="result-box">
                        <div class="result-meta">
                            <div class="meta-chip">
                                <div class="meta-chip-label">Jarak</div>
                                <div class="meta-chip-val">${formatAngka(jarak)} KM</div>
                            </div>
                            <div class="meta-chip">
                                <div class="meta-chip-label">Tonase</div>
                                <div class="meta-chip-val">${formatAngka(tonase)} KG</div>
                            </div>
                        </div>
                        <div class="divider-r"></div>
                        ${priceSection}
                    </div>`;

                hasilDiv.classList.add('show');
            }, 1000);
        }
    </script>
</body>
</html>
